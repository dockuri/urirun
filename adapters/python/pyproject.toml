[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun"
version = "0.4.200"
description = "Language-agnostic URI to handler adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.18",
  "pydantic>=2",
  "urirun-contract>=0.1.0",
  "urirun-connector-router>=0.2.0",
  "urirun-flow>=0.2.2",
]

[project.optional-dependencies]
qr = ["qrcode>=7"]
grpc = ["grpcio>=1.60"]
planfile = ["planfile>=0.1.117"]
llm = ["litellm>=1.60"]
keyauth = ["cryptography>=41"]  # SSH-key admin auth (uri-copy-id, signed /deploy)
yaml = ["pyyaml>=6"]  # YAML manifests (adopt-pack) + `urirun tree --format yaml`
cdp = ["urirun-cdp>=0.1.0"]  # Chrome DevTools Protocol surface (urirun.connectors.surfaces.cdp shim)
uinput = ["urirun-uinput>=0.1.0"]  # Linux uinput keyboard/mouse surface (urirun.connectors.inputs.uinput shim)
openapi = ["urirun-openapi-import>=0.1.0", "urirun-connectors-toolkit>=0.1.0"]  # OpenAPI→URI import
declarative = ["urirun-declarative>=0.1.0", "urirun-connectors-toolkit>=0.1.0"]  # declarative connector spec
host = ["planfile>=0.1.117", "litellm>=1.60", "qrcode[pil]>=7", "docid>=0.1.9", "cryptography>=41", "urirun-widgets>=0.1.0", "urirun-connector-scanner>=0.1.0"]
test = ["planfile>=0.1.117", "pytest>=7"]

[project.scripts]
uri = "urirun:uri_cli"
urirun = "urirun.v2:main"
urirun-v1 = "urirun.v1:main"
urirun-v2 = "urirun.v2:main"
uri-copy-id = "urirun.node.mesh:copy_id_cli"

# In-core URI surfaces (trace-first authoring): a promoted known-good run replayable by name,
# and a session recorder. Declared as bindings so skill:// / session:// resolve like any connector.
[project.entry-points."urirun.bindings"]
skill = "urirun.node.skill:skill_bindings"
session = "urirun.node.skill:session_bindings"
ready = "urirun.node.preconditions:ready_bindings"
access = "urirun_runtime.access:access_bindings"

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun*"]
# urirun_flow and urirun_connector_router are OWNED by sibling repos (urirun-flow,
# urirun-connector-router); the local dirs are stale snapshots and must never ship.
exclude = ["urirun_flow*", "urirun_connector_router*"]

[tool.setuptools.package-data]
# Static assets served by the dashboard from their package dir (read fresh per request):
# the extracted dashboard.js + the twin monitor widget. Must ship in the wheel or the
# /dashboard.js and /twin routes 404 on a `pip install urirun[host]`.
"urirun.host" = ["*.html", "*.js", "*.css"]


[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
# Deferred imports placed after code break import cycles between the runtime
# modules (introspect↔v2, _runtime↔_registry/_scan); E731 is one local table-
# formatting lambda. These are intentional, not lint debt.
"urirun/__init__.py" = ["F401", "F402", "F811", "E402"]
"urirun/host/connector_admin.py" = ["E402"]
"urirun/host/host_dashboard.py" = ["E402", "F401", "F811"]
"urirun/runtime/_runtime.py" = ["E402", "E731"]
"urirun/runtime/v2.py" = ["E402"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true
